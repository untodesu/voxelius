site_name: Voxelius
site_url: https://voxelius.codeberg.page/voxelius
repo_url: https://codeberg.org/voxelius/voxelius
repo_name: voxelius/voxelius
# use_directory_urls: false

plugins:
  - glightbox:
  - minify:
      minify_html: true
  - mkdocs-video:
  - search:

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
  - pymdownx.snippets:
  - pymdownx.superfences:

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        name: Switch to dark mode
        icon: material/weather-night
      primary: black
      accent: black
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        name: Switch to light mode
        icon: material/weather-sunny
      primary: black
      accent: black
  features:
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
  favicon: favicon.ico
  logo: favicon.png

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About:
    - History: about/history.md
    - Features: about/features.md
  - Documentation:
    - dev/index.md
    - Engine:
      - Getting Started:
        - Requirements: dev/engine/init-requirements.md
        - Source Hierarchy: dev/engine/init-sources.md
        - Build Guide: dev/engine/init-building.md
      - Architecture Overview:
        - Core: dev/engine/arch-core.md
        - Rendering: dev/engine/arch-rendering.md
        - Networking: dev/engine/arch-networking.md
        - Sound: dev/engine/arch-sound.md
      - Development:
        - Code Style: dev/engine/dev-code-style.md
        - Contributing: dev/engine/dev-contributing.md
    - Modding:
      - Getting Started:
        - Overview: dev/modding/init-overview.md
        - Mod Metadata: dev/modding/init-modinfo.md
        - Filesystem: dev/modding/init-filesystem.md
      - Engine API:
        - Lua Base: dev/modding/api-lua.md
        - Core: dev/modding/api-core.md
        - Blocks: dev/modding/api-blocks.md
        - World: dev/modding/api-world.md
      - File Formats:
        - Block Models: dev/modding/format-bmodel.md
        - Block Collisions: dev/modding/format-bcoll.md
      - Libraries:
        - Slabs: dev/modding/lib-slabs.md
